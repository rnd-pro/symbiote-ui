<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sn-timeline-editor — Visual Test</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111;
      color: #eee;
      font-family: 'Inter', system-ui, sans-serif;
    }
    h1 {
      font-size: 14px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span { opacity: 0.5; font-weight: 400; font-size: 11px; }
    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .controls button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    .controls button:hover { background: rgba(255,255,255,0.1); color: #fff; }
    sn-timeline-editor { flex: 1; }
    .info {
      padding: 6px 12px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .info span { color: rgba(255,255,255,0.6); }
  </style>
</head>

<body>
  <h1>
    🎬 sn-timeline-editor
    <span>Visual Test — Mock Data</span>
  </h1>
  <div class="controls">
    <button id="btn-mock-basic">Load Basic Mock</button>
    <button id="btn-mock-complex">Load Complex Mock</button>
    <button id="btn-mock-music">Load Music Video Mock</button>
    <button id="btn-clear">Clear</button>
  </div>
  <sn-timeline-editor id="timeline"></sn-timeline-editor>
  <div class="info">
    Playhead: <span id="info-frame">0</span> |
    Time: <span id="info-time">0.00s</span> |
    Event: <span id="info-event">-</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@symbiotejs/symbiote": "./node_modules/@symbiotejs/symbiote/core/index.js",
      "@symbiotejs/symbiote/": "./node_modules/@symbiotejs/symbiote/"
    }
  }
  </script>

  <script type="module">
    import './timeline/TimelineEditor/TimelineEditor.js';

    let tl = document.getElementById('timeline');
    let infoFrame = document.getElementById('info-frame');
    let infoTime = document.getElementById('info-time');
    let infoEvent = document.getElementById('info-event');

    // ── Mock Data Sets ──

    let basicMock = {
      fps: 30,
      duration: 300,
      tracks: [
        {
          id: 'v1', type: 'video', label: 'Video 1',
          clips: [
            { id: 'c1', start: 0, end: 90, label: 'Intro' },
            { id: 'c2', start: 100, end: 250, label: 'Main Content' },
            { id: 'c3', start: 260, end: 300, label: 'Outro' },
          ],
        },
        {
          id: 'a1', type: 'audio', label: 'Music',
          clips: [
            { id: 'c4', start: 0, end: 300, label: 'Background Music' },
          ],
        },
        {
          id: 't1', type: 'text', label: 'Captions',
          clips: [
            { id: 'c5', start: 10, end: 80, label: 'Title Card' },
            { id: 'c6', start: 120, end: 200, label: 'Subtitle' },
          ],
        },
      ],
      markers: [
        { frame: 0, label: 'Start' },
        { frame: 90, label: 'Cut 1' },
        { frame: 250, label: 'Cut 2' },
      ],
    };

    let complexMock = {
      fps: 24,
      duration: 720,
      tracks: [
        {
          id: 'v1', type: 'video', label: 'Camera A',
          clips: [
            { id: 'c1', start: 0, end: 120, label: 'Wide Shot' },
            { id: 'c2', start: 130, end: 300, label: 'Medium' },
            { id: 'c3', start: 320, end: 500, label: 'Close Up' },
            { id: 'c4', start: 520, end: 720, label: 'Aerial' },
          ],
        },
        {
          id: 'v2', type: 'video', label: 'Camera B',
          clips: [
            { id: 'c5', start: 50, end: 180, label: 'B-Roll 1' },
            { id: 'c6', start: 350, end: 480, label: 'B-Roll 2' },
          ],
        },
        {
          id: 'a1', type: 'audio', label: 'Dialogue',
          clips: [
            { id: 'c7', start: 20, end: 280, label: 'Interview' },
            { id: 'c8', start: 340, end: 680, label: 'Narration' },
          ],
        },
        {
          id: 'a2', type: 'audio', label: 'Music',
          clips: [
            { id: 'c9', start: 0, end: 720, label: 'Cinematic Score' },
          ],
        },
        {
          id: 'a3', type: 'audio', label: 'SFX',
          clips: [
            { id: 'c10', start: 120, end: 135, label: 'Whoosh' },
            { id: 'c11', start: 300, end: 320, label: 'Impact' },
            { id: 'c12', start: 500, end: 525, label: 'Transition' },
          ],
        },
        {
          id: 'e1', type: 'effect', label: 'Effects',
          clips: [
            { id: 'c13', start: 120, end: 140, label: 'Cross Dissolve' },
            { id: 'c14', start: 300, end: 330, label: 'Color Shift' },
            { id: 'c15', start: 500, end: 530, label: 'Fade Out' },
          ],
        },
        {
          id: 't1', type: 'text', label: 'Lower Thirds',
          clips: [
            { id: 'c16', start: 50, end: 150, label: 'Name: John Doe' },
            { id: 'c17', start: 350, end: 420, label: 'Location: NYC' },
          ],
        },
      ],
      markers: [
        { frame: 0, label: 'Start' },
        { frame: 120, label: 'Act 1' },
        { frame: 300, label: 'Act 2' },
        { frame: 500, label: 'Act 3' },
        { frame: 720, label: 'End' },
      ],
    };

    let musicMock = {
      fps: 30,
      duration: 5400,
      tracks: [
        {
          id: 'v1', type: 'video', label: 'Main Video',
          clips: [
            { id: 'c1', start: 0, end: 900, label: 'Verse 1' },
            { id: 'c2', start: 900, end: 1800, label: 'Chorus' },
            { id: 'c3', start: 1800, end: 2700, label: 'Verse 2' },
            { id: 'c4', start: 2700, end: 3600, label: 'Bridge' },
            { id: 'c5', start: 3600, end: 4500, label: 'Final Chorus' },
            { id: 'c6', start: 4500, end: 5400, label: 'Outro' },
          ],
        },
        {
          id: 'a1', type: 'audio', label: 'Vocals',
          clips: [
            { id: 'c7', start: 0, end: 5400, label: 'Vocal Track' },
          ],
        },
        {
          id: 'a2', type: 'audio', label: 'Instrumental',
          clips: [
            { id: 'c8', start: 0, end: 5400, label: 'Beat' },
          ],
        },
        {
          id: 'e1', type: 'effect', label: 'Visual FX',
          clips: [
            { id: 'c9', start: 900, end: 1800, label: 'Glow Pulse' },
            { id: 'c10', start: 2700, end: 3600, label: 'Particles' },
            { id: 'c11', start: 3600, end: 4500, label: 'Color Wash' },
          ],
        },
        {
          id: 't1', type: 'text', label: 'Lyrics',
          clips: Array.from({ length: 18 }, (_, i) => ({
            id: `lyric-${i}`,
            start: i * 300,
            end: (i + 1) * 300 - 15,
            label: `Line ${i + 1}`,
          })),
        },
      ],
      markers: [
        { frame: 0, label: 'Intro' },
        { frame: 900, label: 'Chorus' },
        { frame: 1800, label: 'V2' },
        { frame: 2700, label: 'Bridge' },
        { frame: 3600, label: 'Final' },
        { frame: 4500, label: 'Outro' },
      ],
    };

    // ── Events ──

    tl.addEventListener('playhead-change', (e) => {
      infoFrame.textContent = e.detail.frame;
      infoTime.textContent = e.detail.time.toFixed(2) + 's';
    });

    tl.addEventListener('clip-select', (e) => {
      infoEvent.textContent = `Selected: ${e.detail.clip.label || e.detail.clipId}`;
    });

    tl.addEventListener('transport-change', (e) => {
      infoEvent.textContent = `Transport: ${e.detail.action}`;
    });

    tl.addEventListener('zoom-change', (e) => {
      infoEvent.textContent = `Zoom: ${e.detail.pixelsPerFrame.toFixed(2)} px/fr`;
    });

    // ── Buttons ──

    document.getElementById('btn-mock-basic').onclick = () => {
      tl.loadTimeline(basicMock);
      infoEvent.textContent = 'Loaded: Basic Mock (3 tracks, 10s)';
    };

    document.getElementById('btn-mock-complex').onclick = () => {
      tl.loadTimeline(complexMock);
      infoEvent.textContent = 'Loaded: Complex Mock (7 tracks, 30s)';
    };

    document.getElementById('btn-mock-music').onclick = () => {
      tl.loadTimeline(musicMock);
      infoEvent.textContent = 'Loaded: Music Video Mock (5 tracks, 3min)';
    };

    document.getElementById('btn-clear').onclick = () => {
      tl.loadTimeline({ fps: 30, duration: 0, tracks: [] });
      infoEvent.textContent = 'Cleared';
    };

    // Auto-load basic mock
    tl.loadTimeline(basicMock);
    infoEvent.textContent = 'Auto-loaded: Basic Mock';
  </script>
</body>

</html>
