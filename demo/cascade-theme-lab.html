<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>symbiote-ui Cascade Theme Lab</title>
  <script type="importmap">
    {
      "imports": {
        "@symbiotejs/symbiote": "../node_modules/@symbiotejs/symbiote/core/index.js",
        "@symbiotejs/symbiote/": "../node_modules/@symbiotejs/symbiote/",
        "symbiote-engine": "../node_modules/symbiote-engine/index.js",
        "symbiote-engine/": "../node_modules/symbiote-engine/"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--sn-bg, #1a1a1a);
      color: var(--sn-text, #f0f0f0);
      font-family: var(--sn-font, Inter, system-ui, sans-serif);
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    .lab-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      background:
        linear-gradient(to bottom, var(--sn-node-bg, #202020), transparent 78px),
        var(--sn-bg, #1a1a1a);
      overflow: hidden;
    }

    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      height: var(--sn-app-topbar-height, 40px);
      min-width: 0;
      padding: var(--sn-app-topbar-padding, 0 16px);
      background: transparent;
    }

    .topbar-left,
    .topbar-right,
    .topbar-center {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .topbar-left {
      gap: var(--sn-app-title-gap, 8px);
      flex: 0 0 auto;
    }

    .topbar-right {
      justify-content: flex-end;
      gap: var(--sn-app-topbar-right-gap, 8px);
      flex: 0 1 210px;
      color: var(--sn-text-dim);
      font-size: var(--sn-app-topbar-meta-size, 11px);
      white-space: nowrap;
    }

    .topbar-center {
      position: absolute;
      left: 50%;
      gap: var(--sn-lab-menu-gap, 4px);
      max-width: min(58vw, 720px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0;
      transform: translateX(-50%);
      scrollbar-width: none;
    }

    .topbar-center::-webkit-scrollbar {
      display: none;
    }

    .app-title-icon {
      flex: 0 0 auto;
      color: var(--sn-node-selected);
      font-size: var(--sn-app-title-icon-size, 16px);
    }

    .app-title {
      margin: 0;
      min-width: 0;
      color: var(--sn-text);
      font-size: var(--sn-app-title-size, 13px);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
      white-space: nowrap;
    }

    .topbar-sep {
      width: 1px;
      height: var(--sn-lab-menu-separator-height, 20px);
      background: var(--sn-node-border);
    }

    .follow-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sn-lab-menu-button-gap, 5px);
      flex: 0 0 auto;
      min-height: var(--sn-lab-menu-button-height, 26px);
      padding: var(--sn-lab-menu-button-padding, 4px 10px);
      border: 1px solid transparent;
      border-radius: var(--sn-layout-header-button-radius, 4px);
      background: transparent;
      color: var(--sn-text-dim);
      font: inherit;
      font-size: var(--sn-lab-menu-button-size, 11px);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .follow-btn:hover,
    .follow-btn[active] {
      border-color: var(--sn-node-border);
      background: var(--sn-node-hover);
      color: var(--sn-text);
    }

    .follow-btn .material-symbols-outlined {
      font-size: var(--sn-lab-menu-icon-size, 16px);
    }

    .lab-layout-tabs {
      --sn-tabs-height: var(--sn-lab-tabs-height, 34px);
      --sn-tabs-item-height: var(--sn-lab-tabs-item-height, 30px);
      --sn-tabs-bg: color-mix(in srgb, var(--sn-panel-bg) 88%, var(--sn-bg) 12%);
      --sn-tabs-border: var(--sn-node-border);
      --sn-tabs-active-bg: var(--sn-panel-bg);
      --sn-tabs-hover-bg: var(--sn-node-hover);
      --sn-tabs-divider: var(--sn-node-border);
      --sn-tabs-radius: 6px 6px 0 0;
      --sn-tabs-corner-size: 8px;
      --sn-tabs-corner-cut: 7px;
      --sn-tabs-accent: var(--sn-node-selected);
    }

    .lab-content {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .lab-layout {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    cascade-graph-panel,
    cascade-ui-panel {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lab-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sample-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: var(--sn-lab-panel-gap, 12px);
      height: 100%;
      padding: var(--sn-lab-panel-padding, 12px);
      background: var(--sn-panel-bg);
      color: var(--sn-text);
      overflow: hidden;
    }

    .sample-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sn-lab-row-gap, 8px);
      align-items: center;
    }

    .sample-scroll {
      min-height: 0;
      overflow: auto;
      padding: var(--sn-lab-scroll-padding, 8px);
      border: 1px solid var(--sn-node-border);
      border-radius: var(--sn-node-radius);
      background: var(--sn-bg);
      scrollbar-color: var(--sn-scrollbar-thumb) var(--sn-scrollbar-track);
      scrollbar-width: var(--sn-scrollbar-width, thin);
    }

    .sample-scroll::-webkit-scrollbar {
      width: var(--sn-scrollbar-size, 10px);
      height: var(--sn-scrollbar-size, 10px);
    }

    .sample-scroll::-webkit-scrollbar-track {
      background: var(--sn-scrollbar-track, transparent);
    }

    .sample-scroll::-webkit-scrollbar-thumb {
      min-height: var(--sn-scrollbar-thumb-min-size, 36px);
      border: var(--sn-scrollbar-thumb-border, 3px solid transparent);
      border-radius: var(--sn-scrollbar-radius, 999px);
      background: var(--sn-scrollbar-thumb);
      background-clip: content-box;
    }

    .sample-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--sn-scrollbar-thumb-hover);
      background-clip: content-box;
    }

    .sample-stack {
      display: grid;
      gap: var(--sn-lab-stack-gap, 10px);
      min-height: 720px;
    }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sn-lab-token-gap, 8px);
    }

    .token-chip {
      min-width: 0;
      padding: var(--sn-lab-token-padding, 10px);
      border: 1px solid var(--sn-node-border);
      border-radius: var(--sn-node-radius);
      background: var(--sn-node-bg);
    }

    .token-chip strong,
    .token-chip span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .token-chip strong {
      color: var(--sn-text);
      font-size: var(--sn-lab-token-label-size, 12px);
    }

    .token-chip span {
      margin-top: 4px;
      color: var(--sn-text-dim);
      font-size: var(--sn-lab-token-value-size, 11px);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app-topbar {
        align-items: stretch;
        flex-direction: column;
        height: auto;
        min-height: var(--sn-app-topbar-height, 40px);
        padding: 8px 10px;
      }

      .topbar-center {
        position: static;
        order: 3;
        width: 100%;
        max-width: 100%;
        transform: none;
      }

      .topbar-right {
        justify-content: flex-start;
        flex-basis: auto;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell lab-shell">
    <header class="app-topbar lab-topbar">
      <div class="topbar-left">
        <span class="material-symbols-outlined app-title-icon" aria-hidden="true">hub</span>
        <h1 class="app-title">Cascade Theme Lab</h1>
      </div>
      <nav class="topbar-center lab-main-menu" aria-label="Main menu">
        <button class="follow-btn lab-menu-button" type="button" data-layout-group="overview">
          <span class="material-symbols-outlined">view_quilt</span><span>Overview</span>
        </button>
        <button class="follow-btn lab-menu-button" type="button" data-layout-group="graph">
          <span class="material-symbols-outlined">hub</span><span>Graph</span>
        </button>
        <button class="follow-btn lab-menu-button" type="button" data-layout-group="chat">
          <span class="material-symbols-outlined">forum</span><span>Chat</span>
        </button>
        <button class="follow-btn lab-menu-button" type="button" data-layout-group="responsive">
          <span class="material-symbols-outlined">view_agenda</span><span>Responsive</span>
        </button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button class="follow-btn lab-menu-button" type="button" data-layout-command="reset">
          <span class="material-symbols-outlined">restart_alt</span><span>Reset</span>
        </button>
        <button class="follow-btn lab-menu-button" type="button" data-layout-command="scroll">
          <span class="material-symbols-outlined">swap_horiz</span><span>Scroll</span>
        </button>
      </nav>
      <div class="topbar-right" aria-label="Current module">
        <span class="project-name">symbiote-ui</span>
        <span class="topbar-sep" aria-hidden="true"></span>
        <span class="project-files">layout module</span>
      </div>
    </header>
    <project-tabs class="lab-layout-tabs"></project-tabs>
    <section class="lab-content" aria-label="Cascade theme visual surface">
      <panel-layout class="lab-layout"></panel-layout>
    </section>
  </main>
  <script type="module" src="./cascade-theme-lab.js?v=20260604-theme-editor"></script>
</body>

</html>
