<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>symbiote-ui Cascade Theme Lab</title>
  <script type="importmap">
    {
      "imports": {
        "@symbiotejs/symbiote": "../node_modules/@symbiotejs/symbiote/core/index.js",
        "@symbiotejs/symbiote/": "../node_modules/@symbiotejs/symbiote/",
        "symbiote-engine": "../node_modules/symbiote-engine/index.js",
        "symbiote-engine/": "../node_modules/symbiote-engine/"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--sn-bg, #1a1a1a);
      color: var(--sn-text, #f0f0f0);
      font-family: var(--sn-font, Inter, system-ui, sans-serif);
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    .lab-shell {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100vh;
      background:
        radial-gradient(circle, var(--sn-grid-dot, rgb(255 255 255 / 0.06)) 1.2px, transparent 1.2px) 0 0 / var(--sn-grid-size, 20px) var(--sn-grid-size, 20px),
        var(--sn-bg);
    }

    .lab-toolbar {
      display: flex;
      align-items: center;
      gap: var(--sn-lab-toolbar-gap, 12px);
      min-width: 0;
      padding: var(--sn-lab-toolbar-padding, 10px 12px);
      border-bottom: 1px solid var(--sn-node-border);
      background: color-mix(in srgb, var(--sn-panel-bg) 92%, transparent);
    }

    .lab-main-menu {
      display: flex;
      align-items: center;
      gap: var(--sn-lab-menu-gap, 4px);
      min-width: 0;
    }

    .lab-menu-separator {
      width: 1px;
      height: var(--sn-lab-menu-separator-height, 20px);
      background: var(--sn-node-border);
    }

    .lab-menu-button {
      display: inline-flex;
      align-items: center;
      gap: var(--sn-lab-menu-button-gap, 5px);
      min-height: var(--sn-lab-menu-button-height, 28px);
      padding: var(--sn-lab-menu-button-padding, 0 10px);
      border: 1px solid transparent;
      border-radius: var(--sn-layout-header-button-radius, 4px);
      background: transparent;
      color: var(--sn-text-dim);
      font: inherit;
      font-size: var(--sn-lab-menu-button-size, 12px);
      cursor: pointer;
      white-space: nowrap;
    }

    .lab-menu-button:hover,
    .lab-menu-button[active] {
      border-color: var(--sn-node-border);
      background: var(--sn-node-hover);
      color: var(--sn-text);
    }

    .lab-menu-button .material-symbols-outlined {
      font-size: var(--sn-lab-menu-icon-size, 16px);
    }

    .lab-layout-tabs {
      --sn-tabs-height: var(--sn-lab-tabs-height, 34px);
      --sn-tabs-item-height: var(--sn-lab-tabs-item-height, 30px);
      --sn-tabs-bg: color-mix(in srgb, var(--sn-panel-bg) 88%, var(--sn-bg) 12%);
      --sn-tabs-border: var(--sn-node-border);
      --sn-tabs-active-bg: var(--sn-panel-bg);
      --sn-tabs-hover-bg: var(--sn-node-hover);
      --sn-tabs-divider: var(--sn-node-border);
      --sn-tabs-radius: 6px 6px 0 0;
      --sn-tabs-corner-size: 8px;
      --sn-tabs-corner-cut: 7px;
      --sn-tabs-accent: var(--sn-node-selected);
    }

    .lab-title {
      margin: 0;
      min-width: 180px;
      font-size: var(--sn-lab-title-size, 14px);
      font-weight: 700;
      line-height: 1.2;
    }

    .lab-meta {
      color: var(--sn-text-dim);
      font-size: var(--sn-lab-control-font-size, 12px);
      white-space: nowrap;
    }

    .lab-content {
      min-height: 0;
      padding: var(--sn-lab-content-padding, 12px);
    }

    .lab-layout {
      width: 100%;
      height: calc(100vh - 102px);
      min-height: 0;
    }

    cascade-graph-panel,
    cascade-ui-panel {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lab-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sample-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: var(--sn-lab-panel-gap, 12px);
      height: 100%;
      padding: var(--sn-lab-panel-padding, 12px);
      background: var(--sn-panel-bg);
      color: var(--sn-text);
      overflow: hidden;
    }

    .sample-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sn-lab-row-gap, 8px);
      align-items: center;
    }

    .sample-scroll {
      min-height: 0;
      overflow: auto;
      padding: var(--sn-lab-scroll-padding, 8px);
      border: 1px solid var(--sn-node-border);
      border-radius: var(--sn-node-radius);
      background: var(--sn-bg);
      scrollbar-color: var(--sn-scrollbar-thumb) var(--sn-scrollbar-track);
      scrollbar-width: var(--sn-scrollbar-width, thin);
    }

    .sample-scroll::-webkit-scrollbar {
      width: var(--sn-scrollbar-size, 10px);
      height: var(--sn-scrollbar-size, 10px);
    }

    .sample-scroll::-webkit-scrollbar-track {
      background: var(--sn-scrollbar-track, transparent);
    }

    .sample-scroll::-webkit-scrollbar-thumb {
      min-height: var(--sn-scrollbar-thumb-min-size, 36px);
      border: var(--sn-scrollbar-thumb-border, 3px solid transparent);
      border-radius: var(--sn-scrollbar-radius, 999px);
      background: var(--sn-scrollbar-thumb);
      background-clip: content-box;
    }

    .sample-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--sn-scrollbar-thumb-hover);
      background-clip: content-box;
    }

    .sample-stack {
      display: grid;
      gap: var(--sn-lab-stack-gap, 10px);
      min-height: 720px;
    }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sn-lab-token-gap, 8px);
    }

    .token-chip {
      min-width: 0;
      padding: var(--sn-lab-token-padding, 10px);
      border: 1px solid var(--sn-node-border);
      border-radius: var(--sn-node-radius);
      background: var(--sn-node-bg);
    }

    .token-chip strong,
    .token-chip span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .token-chip strong {
      color: var(--sn-text);
      font-size: var(--sn-lab-token-label-size, 12px);
    }

    .token-chip span {
      margin-top: 4px;
      color: var(--sn-text-dim);
      font-size: var(--sn-lab-token-value-size, 11px);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .lab-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .lab-main-menu {
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .lab-layout {
        height: 980px;
      }
    }
  </style>
</head>

<body>
  <main class="lab-shell">
    <header class="lab-toolbar">
      <h1 class="lab-title">Cascade Theme Lab</h1>
      <nav class="lab-main-menu" aria-label="Main menu">
        <button class="lab-menu-button" type="button" data-layout-group="overview">
          <span class="material-symbols-outlined">view_quilt</span><span>Overview</span>
        </button>
        <button class="lab-menu-button" type="button" data-layout-group="graph">
          <span class="material-symbols-outlined">hub</span><span>Graph</span>
        </button>
        <button class="lab-menu-button" type="button" data-layout-group="chat">
          <span class="material-symbols-outlined">forum</span><span>Chat</span>
        </button>
        <button class="lab-menu-button" type="button" data-layout-group="responsive">
          <span class="material-symbols-outlined">view_agenda</span><span>Responsive</span>
        </button>
        <span class="lab-menu-separator" aria-hidden="true"></span>
        <button class="lab-menu-button" type="button" data-layout-command="reset">
          <span class="material-symbols-outlined">restart_alt</span><span>Reset</span>
        </button>
        <button class="lab-menu-button" type="button" data-layout-command="scroll">
          <span class="material-symbols-outlined">swap_horiz</span><span>Scroll</span>
        </button>
      </nav>
      <span class="lab-meta">layout module</span>
    </header>
    <project-tabs class="lab-layout-tabs"></project-tabs>
    <section class="lab-content" aria-label="Cascade theme visual surface">
      <panel-layout class="lab-layout"></panel-layout>
    </section>
  </main>
  <script type="module" src="./cascade-theme-lab.js?v=20260604-theme-editor"></script>
</body>

</html>
