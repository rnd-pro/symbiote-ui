<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>symbiote-ui demos</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: #e8e8e8;
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      display: grid;
      gap: 18px;
      width: min(760px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    a {
      display: grid;
      gap: 6px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #222;
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #c87533;
      outline: none;
    }

    strong {
      font-size: 15px;
    }

    span {
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>symbiote-ui demos</h1>
    <a href="./pcb-router-stress.html">
      <strong>PCB Router Stress</strong>
      <span>Animated route diagnostics with orbit metrics, keyframes, and agent-readable samples.</span>
    </a>
    <a href="./cascade-theme-lab.html">
      <strong>Showcase Demo</strong>
      <span>Project tree, source editor, markdown viewer, graph, chat, voice, runtime, spatial, and cascade theme showcase.</span>
    </a>
  </main>
</body>

</html>
