<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Symbiote UI · Presenter marker references</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#090b0f;color:#f6f7fa}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#231526 0,#0b0d12 34rem)}
    main{width:min(1800px,calc(100% - 32px));margin:auto;padding:40px 0 80px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,640px);gap:28px;align-items:end;margin-bottom:36px}
    h1{font-size:clamp(34px,5vw,72px);line-height:.94;margin:0 0 18px;letter-spacing:-.045em}.lede{max-width:70ch;color:#aeb7c9;line-height:1.55}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#13161d;border:1px solid #252b38;border-radius:18px;padding:18px}.controls label{display:grid;gap:6px;color:#9ca7ba;font:600 12px ui-monospace,monospace}.controls label:last-child{grid-column:1/-1}
    select,input{width:100%;border:1px solid #343b4b;border-radius:9px;background:#0c0f14;color:#f7f8fb;padding:10px 12px;font:inherit}
    [data-interactive-preview]{border:1px solid #2a3040;border-radius:18px;overflow:hidden;background:#101217;margin-bottom:44px}[data-interactive-preview] svg{display:block;width:100%;height:auto}
    [data-marker-gallery]{display:grid;gap:30px}.marker-card{background:#11141a;border:1px solid #242a36;border-radius:22px;padding:20px;box-shadow:0 28px 80px #0005}.marker-card>header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.marker-card h2{font-size:26px;margin:3px 0 0}.marker-card p{margin:0;color:#9ca6b9}.tier{color:#ff78a7;font:700 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}
    .variant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;border:1px solid #282e3a;border-radius:13px;overflow:hidden;background:#0d1015}figure svg{display:block;width:100%;height:auto}figcaption{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;color:#8f9aae;font-size:11px}code{color:#ff91b7}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.variant-grid{grid-template-columns:1fr}.marker-card>header{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div><h1>Felt-tip presenter gestures</h1><p class="lede">Production geometry references for every marker in the Symbiote Show contract. Every ribbon below comes from the same deterministic geometry and kinematics used by the live presenter renderer.</p></div>
      <form class="controls" data-reference-controls>
        <label>Marker<select name="marker"></select></label>
        <label>Geometry<select name="target"></select></label>
        <label>Seed<input name="seed" value="reference-alpha"></label>
      </form>
    </section>
    <section data-interactive-preview aria-label="Interactive marker preview"></section>
    <section data-marker-gallery></section>
  </main>
  <script type="module" src="./presenter-marker-reference.js"></script>
</body>
</html>
